<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint by Number ✦</title>
  <meta name="description" content="A kawaii paint-by-number game. Choose a photo, fill in the regions with the right colors, and complete the picture!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════ MENU SCREEN ══════════════ -->
<div class="screen" id="menuScreen">
  <div class="menu-card">
    <span class="deco" style="top:14px;left:18px;">✦</span>
    <span class="deco" style="top:14px;right:18px;">★</span>
    <span class="deco" style="bottom:14px;left:18px;">✿</span>
    <span class="deco" style="bottom:14px;right:18px;">♡</span>

    <!-- Kawaii SVG illustration -->
    <svg viewBox="0 0 280 140" width="100%" height="110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:block;margin:0 auto 0.8rem;">
      <ellipse cx="140" cy="80" rx="120" ry="55" fill="#ddeeff" opacity="0.5"/>
      <!-- Big flower left -->
      <g transform="translate(58,80)">
        <circle cx="0" cy="-17" r="9" fill="#a0c4f8"/><circle cx="13" cy="-10" r="9" fill="#a0c4f8"/>
        <circle cx="13" cy="5" r="9" fill="#a0c4f8"/><circle cx="0" cy="13" r="9" fill="#a0c4f8"/>
        <circle cx="-13" cy="5" r="9" fill="#a0c4f8"/><circle cx="-13" cy="-10" r="9" fill="#a0c4f8"/>
        <circle cx="0" cy="0" r="10" fill="#e0f0ff"/><circle cx="0" cy="0" r="5" fill="#5b9fe8"/>
      </g>
      <!-- Medium flower right -->
      <g transform="translate(215,72)">
        <circle cx="0" cy="-14" r="7.5" fill="#c4daff"/><circle cx="11" cy="-7" r="7.5" fill="#c4daff"/>
        <circle cx="11" cy="5" r="7.5" fill="#c4daff"/><circle cx="0" cy="12" r="7.5" fill="#c4daff"/>
        <circle cx="-11" cy="5" r="7.5" fill="#c4daff"/><circle cx="-11" cy="-7" r="7.5" fill="#c4daff"/>
        <circle cx="0" cy="0" r="8.5" fill="#e8f4ff"/><circle cx="0" cy="0" r="4" fill="#5b9fe8"/>
      </g>
      <!-- Small flower top center -->
      <g transform="translate(140,32)">
        <circle cx="0" cy="-11" r="6.5" fill="#b8d0ff"/><circle cx="9" cy="-5" r="6.5" fill="#b8d0ff"/>
        <circle cx="9" cy="5" r="6.5" fill="#b8d0ff"/><circle cx="0" cy="11" r="6.5" fill="#b8d0ff"/>
        <circle cx="-9" cy="5" r="6.5" fill="#b8d0ff"/><circle cx="-9" cy="-5" r="6.5" fill="#b8d0ff"/>
        <circle cx="0" cy="0" r="7.5" fill="#e8f4ff"/><circle cx="0" cy="0" r="3.5" fill="#2563b0"/>
      </g>
      <!-- Sparkles -->
      <text x="102" y="48" font-size="14" fill="#5b9fe8" opacity="0.8" font-family="sans-serif">★</text>
      <text x="168" y="114" font-size="11" fill="#2563b0" opacity="0.55" font-family="sans-serif">✦</text>
      <text x="83" y="118" font-size="9" fill="#a0c4f8" font-family="sans-serif">✦</text>
      <text x="180" y="44" font-size="10" fill="#a0c4f8" font-family="sans-serif">♡</text>
      <text x="112" y="105" font-size="13" fill="#5b9fe8" opacity="0.65" font-family="sans-serif">♡</text>
      <circle cx="36" cy="92" r="4" fill="#a0c4f8" opacity="0.6"/>
      <circle cx="240" cy="105" r="3" fill="#c4daff" opacity="0.7"/>
      <circle cx="178" cy="122" r="3.5" fill="#a0c4f8" opacity="0.5"/>
    </svg>

    <h1 class="game-title">Paint by Number</h1>
    <p class="game-sub">elige una foto ˊ˗</p>

    <div class="photos-grid" id="photosGrid"></div>

    <button class="btn-play" id="btnPlay" onclick="startGame()">✦ &nbsp;jugar</button>
  </div>
</div>

<!-- ══════════════ GAME SCREEN ══════════════ -->
<div class="screen" id="gameScreen" style="display:none;">

  <!-- Top bar -->
  <div class="game-topbar">
    <button class="btn-back" id="btnBack" onclick="goMenu()">← volver</button>
    <span class="topbar-title" id="gameTitle">Paint by Number</span>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Main game area -->
  <div class="game-layout">

    <!-- Canvas area -->
    <div class="canvas-wrap" id="canvasWrap">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>procesando imagen…</p>
      </div>
      <!-- canvas-container keeps labels positioned relative to the canvas itself -->
      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="region-labels" id="regionLabels"></div>
      </div>
    </div>

    <!-- Color palette panel -->
    <div class="palette-panel" id="palettePanel">
      <div class="palette-header">🎨 paleta</div>
      <div class="palette-swatches" id="paletteSwatches"></div>
      <div class="palette-hint" id="paletteHint">toca una región, luego un color</div>
    </div>

  </div>
</div>

<!-- ══════════════ WIN SCREEN ══════════════ -->
<div class="screen" id="winScreen" style="display:none;">
  <div class="win-card">
    <div class="win-stars" id="winStars">⭐✨⭐</div>
    <div class="win-emoji">🎉</div>
    <h2 class="win-title">¡Lo lograste!</h2>
    <p class="win-sub">Completaste el cuadro~</p>
    <canvas id="winCanvas" class="win-canvas"></canvas>
    <div class="win-buttons">
      <button class="btn-play" onclick="goMenu()" style="max-width:200px;">✦ &nbsp;volver al menú</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
